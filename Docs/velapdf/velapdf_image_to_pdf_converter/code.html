<!DOCTYPE html>

<html class="light" lang="en"><head>

            "on-surface": "#191c1e",

            "surface": "#f7f9fb",
            "tertiary": "#000000",
            "inverse-primary": "#bec6e0",
            "error": "#ba1a1a",
            "on-tertiary": "#ffffff",
            "surface-container-highest": "#e0e3e5",
            "surface-container-lowest": "#ffffff",
            "on-error-container": "#93000a",
            "primary-fixed": "#dae2fd",
            "primary-container": "#131b2e"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",

            "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]

        },
      },
    }

<style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .dashed-border {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='12' ry='12' stroke='%23C6C6CD' stroke-width='2' stroke-dasharray='8%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
      border-radius: 12px;
    }
    .glass-effect {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background border-b border-outline-variant dark:border-outline docked full-width top-0 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 z-50 sticky">
<div class="flex items-center gap-md">
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-200 p-2 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-on-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-on-primary">VelaPDF</h1>
</div>
<div class="flex items-center gap-sm">
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-200 p-2 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-on-primary">history</span>
</button>
</div>
</header>
<main class="w-full max-w-container-max px-margin-mobile md:px-margin-desktop py-xl flex-grow flex flex-col gap-xl mb-24">
<!-- Hero / Content Area -->
<div class="flex flex-col gap-lg">
<div class="flex flex-col">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">Image to PDF</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xl">Convert your photos, screenshots, and scans into professional PDF documents in seconds.</p>
</div>
<!-- Upload Button Area -->
<div class="flex flex-col items-center justify-center py-8">
<label class="bg-primary text-on-primary hover:bg-surface-tint active:scale-[0.98] transition-all duration-200 rounded-full px-8 py-4 font-label-md flex items-center justify-center gap-2 cursor-pointer shadow-md w-full md:w-auto" for="image-upload">
<input accept="image/*" class="hidden" id="image-upload" onchange="handleFileSelect(event)" type="file"/>
<span class="material-symbols-outlined">upload</span>
<span>Upload Image</span>
</label>
</div>
<!-- Preview State Container -->
<div class="hidden flex flex-col gap-md" id="preview-container">
<div class="flex items-center justify-between">
<h3 class="font-label-md text-label-md text-on-surface-variant">SELECTED PREVIEW</h3>
<button class="text-error font-label-md text-label-md hover:underline bg-transparent" onclick="resetSelection()">Remove file</button>
</div>
<div class="bg-surface-container p-lg rounded-xl flex items-center justify-center border border-outline-variant overflow-hidden">
<img alt="Preview" class="max-h-[400px] w-auto rounded-lg shadow-md object-contain" id="image-preview" src=""/>
</div>
</div>
<!-- Empty State (Placeholder UI) -->
<div class="flex flex-col items-center justify-center py-xl bg-surface-container-low rounded-xl border border-outline-variant opacity-60" id="empty-state">
<span class="material-symbols-outlined text-outline !text-5xl mb-md">image_not_supported</span>
<p class="font-body-md text-body-md text-outline">No image selected for conversion</p>
</div>
</div>
</main>
<!-- Sticky Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full glass-effect border-t border-outline-variant px-margin-mobile md:px-margin-desktop py-md z-40">
<div class="max-w-container-max mx-auto flex flex-col gap-md">
<button class="w-full py-4 rounded-full bg-surface-variant text-on-surface-variant font-label-md transition-all duration-300 flex items-center justify-center gap-2 opacity-50 cursor-not-allowed" disabled="" id="convert-btn">
<span class="material-symbols-outlined">picture_as_pdf</span>
        Convert to PDF
      </button>
<!-- Progress Bar (Hidden by default) -->
<div class="hidden w-full" id="progress-wrapper">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-sm text-label-sm text-secondary">Converting...</span>
<span class="font-label-sm text-label-sm text-secondary" id="progress-text">45%</span>
</div>
<div class="w-full h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary-container transition-all duration-300" id="progress-bar" style="width: 45%"></div>
</div>
</div>
</div>
</div>
<script>
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('image-preview');
          const previewContainer = document.getElementById('preview-container');
          const emptyState = document.getElementById('empty-state');
          const convertBtn = document.getElementById('convert-btn');

          preview.src = e.target.result;
          previewContainer.classList.remove('hidden');
          emptyState.classList.add('hidden');
          
          // Activate Button
          convertBtn.disabled = false;
          convertBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
          convertBtn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-surface-tint', 'active:scale-[0.98]', 'shadow-lg');
          
          // Scroll to preview
          previewContainer.scrollIntoView({ behavior: 'smooth' });
        };
        reader.readAsDataURL(file);
      }
    }

    function resetSelection() {
      const previewContainer = document.getElementById('preview-container');
      const emptyState = document.getElementById('empty-state');
      const convertBtn = document.getElementById('convert-btn');
      const fileInput = document.getElementById('image-upload');

      fileInput.value = '';
      previewContainer.classList.add('hidden');
      emptyState.classList.remove('hidden');

      // Reset Button to Disabled State
      convertBtn.disabled = true;
      convertBtn.classList.add('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
      convertBtn.classList.remove('bg-primary', 'text-on-primary', 'hover:bg-surface-tint', 'active:scale-[0.98]', 'shadow-lg');
    }

    // Micro-interaction for conversion
    document.getElementById('convert-btn').addEventListener('click', function() {
      if(this.disabled) return;
      
      const btn = this;
      const progressWrapper = document.getElementById('progress-wrapper');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      
      btn.innerHTML = 'Starting...';
      btn.classList.add('opacity-80', 'pointer-events-none');
      
      setTimeout(() => {
        progressWrapper.classList.remove('hidden');
        let width = 0;
        const interval = setInterval(() => {
          if (width >= 100) {
            clearInterval(interval);
            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Conversion Complete';
            btn.classList.replace('bg-primary', 'bg-secondary-container');
            progressText.innerText = '100%';
          } else {
            width += Math.random() * 10;
            if(width > 100) width = 100;
            progressBar.style.width = width + '%';
            progressText.innerText = Math.floor(width) + '%';
          }
        }, 150);
      }, 500);
    });
  </script>
</body></html>
